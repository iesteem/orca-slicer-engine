name: CI

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lightweight guard that needs no SDK: ensures ENGINE_VERSION stays a single
  # source of truth (regression guard for gap A4).
  # ---------------------------------------------------------------------------
  version-source-check:
    name: Version single-source check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ENGINE_VERSION is defined exactly once
        run: |
          defs=$(grep -rn 'ENGINE_VERSION="' CMakeLists.txt | wc -l)
          if [ "$defs" -ne 1 ]; then
            echo "::error::ENGINE_VERSION must be defined exactly once in CMakeLists.txt (found $defs)."
            echo "It is the single source of truth for the built version."
            exit 1
          fi
          echo "OK: ENGINE_VERSION defined once -> $(grep -m1 'ENGINE_VERSION=' CMakeLists.txt)"

  # ---------------------------------------------------------------------------
  # Full build + test of the ORCA_STATIC (Linux single static binary) target.
  #
  # The static build links libslic3r.a + all deps, which are NOT in this repo.
  # They are produced by an internal pipeline that runs scripts/gen_static_libs.sh
  # against a *pinned* OrcaSlicer commit, then packages:
  #   - cmake/StaticConfig.cmake      (captured include/lib paths)
  #   - package/resources/profiles    (printer/filament/process presets)
  #   - the static archives + includes at the absolute paths recorded in StaticConfig
  # into one tarball/zip and publishes it (GitHub Release / internal storage).
  #
  # NOTE: a fully reproducible clean-clone build (gap A6) is still TODO; until
  # then this job depends on the ORCA_SDK_URL secret being published.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & test (ORCA_STATIC)
    runs-on: ubuntu-latest
    needs: version-source-check
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libboost-all-dev libtbb-dev

      - name: Download prebuilt engine SDK
        env:
          ORCA_SDK_URL: ${{ secrets.ORCA_SDK_URL }}
        run: |
          if [ -z "$ORCA_SDK_URL" ]; then
            echo "::error::ORCA_SDK_URL secret is not set."
            echo "The ORCA_STATIC build requires a prebuilt engine SDK produced from a pinned"
            echo "OrcaSlicer commit (see scripts/gen_static_libs.sh). Publish it as a Release"
            echo "asset / internal artifact and set the ORCA_SDK_URL repository secret."
            exit 1
          fi
          curl -fsSL "$ORCA_SDK_URL" -o /tmp/orca_sdk.zip
          mkdir -p sdk
          if command -v unzip >/dev/null 2>&1; then
            unzip -q /tmp/orca_sdk.zip -d sdk
          else
            python3 -c "import zipfile; zipfile.ZipFile('/tmp/orca_sdk.zip').extractall('sdk')"
          fi
          echo "--- SDK layout (top) ---"
          ls -la sdk
          test -f cmake/StaticConfig.cmake || echo "::warning::cmake/StaticConfig.cmake not found after extract"

      - name: Configure (ORCA_STATIC)
        run: |
          cmake -S . -B build-static -G Ninja \
            -DORCA_STATIC=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-static -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build-static --output-on-failure
